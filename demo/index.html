<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trellis SegPart - Demo Results</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .grid .header {
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            padding: 0.5rem;
            background: #16213e;
            border-radius: 8px;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        model-viewer {
            width: 100%;
            height: 400px;
            border-radius: 4px;
            --poster-color: transparent;
        }
    </style>
</head>
<body>
    <h1>Trellis SegPart - Demo Results</h1>
    <div class="grid">
        <div class="header">Segmentation Views</div>
        <div class="header">Interactive 3D Mesh</div>

        <div class="card"><img src="0.png" alt="seg views"></div>
        <div class="card"><model-viewer src="0.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="1_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="1.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="2_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="2.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="3_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="3.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="4_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="4.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="5_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="5.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="6_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="6.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="7_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="7.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="8_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="8.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="9_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="9.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="10_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="10.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="11_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="11.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="12_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="12.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="13_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="13.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>

        <div class="card"><img src="14_seg_views.png" alt="seg views"></div>
        <div class="card"><model-viewer src="14.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div>
    </div>
</body>
</html>
